name: Release

# 推送 vX.Y.Z tag 自动构建，并以草稿形式创建 Release
on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # 保留完整历史，便于取上一个 tag 生成变更摘要

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: 构建全部平台产物
        run: |
          chmod +x build.sh
          ./build.sh "${GITHUB_REF_NAME#v}"

      - name: 生成 Release Notes
        run: |
          V="${GITHUB_REF_NAME#v}"
          PREV=$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)
          if [[ -n "$PREV" ]]; then
            LOG=$(git log --no-merges --format='- %s' "${PREV}..${GITHUB_REF_NAME}")
          else
            LOG=$(git log --no-merges --format='- %s' -n 20)
          fi
          {
            echo "# v${V}"
            echo
            echo "## 变更内容"
            echo
            echo "${LOG}"
            echo
            echo "## 各平台构建"
            echo
            echo "| 平台    | 架构          | 文件名                                        |"
            echo "|---------|---------------|-----------------------------------------------|"
            echo "| Linux   | x86_64        | campus-net-helper_${V}_linux-amd64            |"
            echo "| Linux   | arm64         | campus-net-helper_${V}_linux-arm64            |"
            echo "| macOS   | Intel         | campus-net-helper_${V}_darwin-amd64           |"
            echo "| macOS   | Apple Silicon | campus-net-helper_${V}_darwin-arm64           |"
            echo "| Windows | x86_64        | campus-net-helper_${V}_windows-amd64.exe      |"
            echo
            echo "校验文件：sha256sums.txt"
            echo
            echo "## 反馈"
            echo "* [Issues](https://github.com/X-xiaohan521/DHUCampusNetHelper/issues)"
          } > release-notes.md

      - name: 创建 Release 草稿
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "${{ github.ref_name }}"
          name: "${{ github.ref_name }}"
          draft: true
          body_path: release-notes.md
          fail_on_unmatched_files: true
          file: |
            dist/campus-net-helper_*
            dist/sha256sums.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
